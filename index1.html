<body>

    <main class="container">

                </div>

        <section class="quotes-section fade-in delay-1">
            <div class="quote-box glass-effect">
                <p class="typing-container"><span id="typing-text"></span></p>
                <p class="typing-container delay-text"><span id="typing-text2"></span></p>

    <script>
        // Memperbaiki tata bahasa tanpa mengubah makna asli
        const text = "Teruslah merasa haus akan ilmu pengetahuan, karena ia jauh lebih bermanfaat daripada sekadar gengsi dan hawa nafsu.";
        const text2 = "\"Ketika saya menulis kode ini, hanya Tuhan dan saya yang mengerti. Sekarang, hanya Tuhan yang tahu.\"";
        const typingSpeed = 40; 

        let index1 = 0; 
        let index2 = 0; 

        function typeEffect1() {
            const typingElement = document.getElementById("typing-text");
            if (index1 < text.length) {
                typingElement.textContent += text.charAt(index1);
                index1++;
                setTimeout(typeEffect1, typingSpeed);
            } else {
                setTimeout(typeEffect2, 500); // Jeda sejenak sebelum teks kedua
            }
        }

        function typeEffect2() {
            const typingElement = document.getElementById("typing-text2");
            if (index2 < text2.length) {
                typingElement.textContent += text2.charAt(index2);
                index2++;
                setTimeout(typeEffect2, typingSpeed);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(typeEffect1, 800); // Mulai setelah animasi fade-in selesai
        });

        // Script Prank tetap dipertahankan
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('prank')) {
                alert('no, you have to stay here lol.');
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        };
    </script>
