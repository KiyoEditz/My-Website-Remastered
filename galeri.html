<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F8FAFC">
    <meta name="description" content="Galeri karya dan momen pilihan Abi Andriansyah.">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="assets/img/favicon/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="assets/img/favicon/apple-touch-icon.png">
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/galeri.css">
    <title>Galeri | Abi Andriansyah</title>
</head>

<body>

    <a class="skip-link" href="#main">Langsung ke konten</a>

    <header class="site-header site-header--wide">
        <!-- KEEP IN SYNC: profil/galeri/music/talent/contact -->
        <nav class="navbar" aria-label="Navigasi utama">
            <div class="nav-container">
                <span class="logo">KiyoEditz.</span>
                <ul class="nav-links">
                    <li><a href="profil.html">Profile</a></li>
                    <li><a href="galeri.html" class="active" aria-current="page">Galeri</a></li>
                    <li><a href="music.html">Music</a></li>
                    <li><a href="talent.html">Talent</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container container--wide" id="main" tabindex="-1">
        <section class="gallery-section fade-in">
            <h1 class="section-title">Koleksi Momen</h1>
            <p class="section-subtitle">Beberapa kenangan dan gambar pilihan.</p>

            <div class="pin-grid">

                <figure class="pin">
                    <button type="button" class="pin-btn" aria-haspopup="dialog"
                        aria-label="Perbesar: Karya Pertama">
                        <img src="assets/img/gallery/gallery-1.webp" width="800" height="1200"
                            alt="Ilustrasi gadis berambut panjang dengan latar senja" decoding="async">
                        <span class="pin-caption">
                            <span class="pin-title">Karya Pertama</span>
                            <span class="pin-desc">Ini adalah deskripsi singkat untuk gambar pertama.</span>
                        </span>
                    </button>
                </figure>

                <figure class="pin">
                    <button type="button" class="pin-btn" aria-haspopup="dialog"
                        aria-label="Perbesar: Eksplorasi Warna">
                        <img src="assets/img/gallery/gallery-2.webp" width="1400" height="954"
                            alt="Ilustrasi panorama dengan permainan warna hangat" loading="lazy" decoding="async">
                        <span class="pin-caption">
                            <span class="pin-title">Eksplorasi Warna</span>
                            <span class="pin-desc">Deskripsi untuk gambar kedua, mungkin dengan cerita yang
                                berbeda.</span>
                        </span>
                    </button>
                </figure>

                <figure class="pin">
                    <button type="button" class="pin-btn" aria-haspopup="dialog"
                        aria-label="Perbesar: Momen Spesial">
                        <img src="assets/img/gallery/gallery-3.webp" width="844" height="1200"
                            alt="Ilustrasi karakter dengan pencahayaan lembut" loading="lazy" decoding="async">
                        <span class="pin-caption">
                            <span class="pin-title">Momen Spesial</span>
                            <span class="pin-desc">Teks unik untuk gambar yang ketiga.</span>
                        </span>
                    </button>
                </figure>

                <figure class="pin">
                    <button type="button" class="pin-btn" aria-haspopup="dialog"
                        aria-label="Perbesar: Penutup Cerita">
                        <img src="assets/img/gallery/gallery-4.webp" width="720" height="612"
                            alt="Ilustrasi penutup dengan komposisi tenang" loading="lazy" decoding="async">
                        <span class="pin-caption">
                            <span class="pin-title">Penutup Cerita</span>
                            <span class="pin-desc">Dan ini adalah deskripsi terakhir.</span>
                        </span>
                    </button>
                </figure>

            </div>
        </section>
    </main>

    <dialog class="lightbox" id="lightbox" aria-labelledby="lightboxTitle">
        <div class="lightbox-stage">
            <img class="lightbox-image" alt="">
            <button type="button" class="lightbox-btn lightbox-close" aria-label="Tutup">&times;</button>
            <button type="button" class="lightbox-btn lightbox-prev" aria-label="Gambar sebelumnya">&lsaquo;</button>
            <button type="button" class="lightbox-btn lightbox-next" aria-label="Gambar berikutnya">&rsaquo;</button>
            <p class="lightbox-counter" aria-live="polite"></p>
        </div>
        <div class="lightbox-caption">
            <h2 id="lightboxTitle" class="lightbox-title"></h2>
            <p class="lightbox-desc"></p>
        </div>
    </dialog>

    <footer class="footer fade-in delay-1">
        <div class="social-links">
            <a href="https://www.instagram.com/kiyoeditz" class="social-btn" target="_blank"
                rel="noopener noreferrer">Instagram</a>
            <a href="https://www.facebook.com/profile.php?id=100077102250480&amp;mibextid=ZbWKwL" class="social-btn"
                target="_blank" rel="noopener noreferrer">Facebook</a>
            <a href="https://discord.com/users/813365850979041302" class="social-btn" target="_blank"
                rel="noopener noreferrer">Discord</a>
        </div>
        <p>© 2026 KiyoTech Corp. All Rights Reserved.</p>
    </footer>

    <script src="assets/js/galeri.js" defer></script>
</body>

</html>
